<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NICE SWING — 左右のブレ</title>
<style>
  :root{ --neon:#a6ff00; --bg:#0a0d0a; --amber:#ffcf5a; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; align-items:center; overflow:hidden; user-select:none; -webkit-user-select:none; }
  header{ width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center; padding:10px 16px; }
  .title{ font-size:17px; font-weight:800; }
  .back{ font-size:12px; font-weight:700; color:rgba(255,255,255,.6); text-decoration:none; }
  .stage{ position:relative; width:100%; max-width:520px; flex:1; background:#000; overflow:hidden; min-height:220px; }
  video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .msg{ position:absolute; left:14px; right:14px; bottom:14px; text-align:center; font-size:16px; font-weight:800;
        color:#fff; text-shadow:0 2px 8px #000,0 0 20px #000; line-height:1.5; }
  .msg b{ color:var(--neon); }
  .result{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
           background:rgba(0,0,0,.55); backdrop-filter:blur(2px); }
  .result .big{ font-size:19vw; font-weight:900; color:var(--amber); line-height:1; text-shadow:0 0 40px rgba(255,207,90,.45); }
  .result .big small{ font-size:7vw; margin-left:4px; }
  .result .lead{ font-size:15px; font-weight:800; color:#fff; margin-bottom:6px; }
  .result .sub{ font-size:12px; font-weight:700; color:rgba(255,255,255,.55); margin-top:12px; }
  .controls{ width:100%; max-width:520px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
  body:has(#stage[style*="none"]) .controls{ flex:1; justify-content:center; }
  .primary{ width:100%; border:none; border-radius:99px; padding:17px; font-size:17px; font-weight:800; color:#000; background:var(--neon); }
  .ghost{ background:none; border:none; color:rgba(255,255,255,.45); font-size:12px; font-weight:700; padding:2px; }
  .setup{ font-size:12.5px; color:rgba(255,255,255,.75); line-height:1.7; font-weight:700; }
  .map{ width:100%; max-width:250px; display:block; margin:0 auto 6px; }
  .steps{ margin:0 0 0 18px; padding:0; font-size:12.5px; line-height:1.85; }
  .steps b{ color:var(--neon); }
  .warn{ text-align:center; font-size:11.5px; color:var(--amber); margin-top:8px; }
  .foot{ font-size:9.5px; font-weight:700; color:rgba(255,255,255,.3); text-align:center; }
</style>
</head>
<body>
  <header>
    <div class="title">左右のブレ</div>
    <a class="back" href="./">← 体感モード</a>
  </header>

  <div class="stage" id="stage" style="display:none">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="msg" id="msg"></div>
    <div class="result" id="result">
      <div class="lead" id="rLead"></div>
      <div class="big" id="rBig"></div>
      <div class="sub" id="rSub"></div>
    </div>
  </div>

  <div class="controls">
    <div class="setup" id="setup">
      <svg viewBox="0 0 250 140" class="map">
        <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#a6ff00"/></marker></defs>
        <line x1="92" y1="40" x2="92" y2="12" stroke="#a6ff00" stroke-width="2.5" marker-end="url(#ah)"/>
        <text x="104" y="24" fill="#a6ff00" font-size="12" font-weight="800">ボールが飛ぶ方向</text>
        <circle cx="92" cy="58" r="8" fill="#fff"/>
        <text x="106" y="62" fill="#fff" font-size="12" font-weight="800">ボール</text>
        <line x1="92" y1="70" x2="92" y2="96" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="100" y="88" fill="rgba(255,255,255,.6)" font-size="11" font-weight="700">1.5mくらい</text>
        <rect x="80" y="98" width="24" height="34" rx="4" fill="none" stroke="#a6ff00" stroke-width="2.5"/>
        <circle cx="92" cy="104" r="2" fill="#a6ff00"/>
        <text x="112" y="120" fill="#a6ff00" font-size="12" font-weight="800">スマホ</text>
        <circle cx="150" cy="54" r="5" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.8"/>
        <line x1="150" y1="59" x2="150" y2="74" stroke="rgba(255,255,255,.4)" stroke-width="1.8"/>
        <line x1="150" y1="64" x2="136" y2="60" stroke="rgba(255,255,255,.4)" stroke-width="1.8"/>
        <text x="160" y="72" fill="rgba(255,255,255,.4)" font-size="11" font-weight="700">打つ人</text>
      </svg>
      <ol class="steps">
        <li><b>ボールのまうしろ</b>に、1.5mくらいはなしてスマホを置く</li>
        <li>カメラを<b>ボールが飛ぶ方向</b>にまっすぐ向けて立てる</li>
        <li>画面の<b>下のほう</b>にボールが写っていればOK</li>
      </ol>
      <div class="warn">⚠️ クラブが当たらない場所に置いてね</div>
    </div>
    <button class="primary" id="btn">🎥 はじめる</button>
    <button class="ghost" id="reset" style="display:none">やりなおす</button>
    <div class="foot">ゴルフボールの直径42.67mmを物差しにした実測です</div>
  </div>

<script>
(function(){
  "use strict";
  var $=function(id){ return document.getElementById(id); };
  var video=$('video'), cv=$('overlay'), cx=cv.getContext('2d');

  var BALL_MM=42.67, AW=640, AH=360;
  var POST=20, BASE_N=10, MOVE_TRIG=1.2, MIN_PIX=12, SEARCH_K=5.0;

  var stream=null, running=false, phase='idle';
  var ref=null, thr=60, baseline=null, baseBuf=[], track=[], postCount=0, lost=0, last=null;
  var fps=0, fpsBuf=[], lastT=0;

  var acv=document.createElement('canvas'); acv.width=AW; acv.height=AH;
  var actx=acv.getContext('2d',{willReadFrequently:true});

  function sizeCanvas(){ var r=cv.getBoundingClientRect(); var d=Math.min(2,window.devicePixelRatio||1);
    cv.width=r.width*d; cv.height=r.height*d; cx.setTransform(d,0,0,d,0,0); }
  window.addEventListener('resize', sizeCanvas);
  function say(s){ $('msg').innerHTML=s; }

  var CAND=[
    { width:{ideal:1280},height:{ideal:720},frameRate:{ideal:240} },
    { width:{ideal:1280},height:{ideal:720},frameRate:{ideal:120} },
    { width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60} },
    { width:{ideal:1280},height:{ideal:720} }
  ];
  async function start(){
    try{
      say('カメラを起動中…');
      var got=false, err=null;
      for(var i=0;i<CAND.length && !got;i++){
        var v={}; for(var k in CAND[i]) v[k]=CAND[i][k];
        v.facingMode={ ideal:'environment' };
        try{ stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false}); got=true; }catch(e){ err=e; }
      }
      if(!got) throw (err||new Error('no camera'));
      $('stage').style.display='block'; $('setup').style.display='none';
      video.srcObject=stream; await video.play(); sizeCanvas();
      running=true; phase='pick';
      $('btn').style.display='none'; $('reset').style.display='block';
      say('ガイドの中にボールが入るように置いて<br>ボールを<b>タップ</b> 👆');
      pump();
    }catch(e){ say('カメラを開始できませんでした<br>（設定→Safari→カメラ の許可を確認）'); }
  }

  function pump(){ if(!running) return;
    if(video.requestVideoFrameCallback) video.requestVideoFrameCallback(onFrame);
    else requestAnimationFrame(function(t){ onFrame(t); }); }

  function onFrame(now){
    if(lastT){ var dt=now-lastT; if(dt>0&&dt<200){ fpsBuf.push(1000/dt); if(fpsBuf.length>40)fpsBuf.shift();
      var s=0; for(var i=0;i<fpsBuf.length;i++)s+=fpsBuf[i]; fps=s/fpsBuf.length; } }
    lastT=now;
    actx.drawImage(video,0,0,AW,AH);
    var img=actx.getImageData(0,0,AW,AH).data;

    var p=null;
    if(ref){
      p=detect(img, ref, last||baseline||{x:AW/2,y:AH/2,r:14});
      if(p){ last=p; lost=0; }
      else { lost++; if(lost>18 && thr<150){ thr+=8; lost=0; } }
    }

    if(phase==='base') doBase(p);
    else if(phase==='ready') doReady(p, now);
    else if(phase==='burst'){ if(p) track.push({x:p.x,y:p.y,r:p.r,t:now}); postCount++; if(postCount>=POST) finish(); }

    draw(p);
    pump();
  }

  function detect(img, rf, guess){
    var win=Math.max(28, guess.r*SEARCH_K);
    var x0=Math.max(0,(guess.x-win)|0), x1=Math.min(AW,(guess.x+win)|0);
    var y0=Math.max(0,(guess.y-win)|0), y1=Math.min(AH,(guess.y+win)|0);
    var t2=thr*thr*3, n=0, sx=0, sy=0;
    for(var y=y0;y<y1;y++){ var row=y*AW;
      for(var x=x0;x<x1;x++){ var i=(row+x)<<2;
        var dr=img[i]-rf.r, dg=img[i+1]-rf.g, db=img[i+2]-rf.b;
        if(dr*dr+dg*dg+db*db < t2){ n++; sx+=x; sy+=y; } } }
    if(n<MIN_PIX) return null;
    return { x:sx/n, y:sy/n, r:Math.sqrt(n/Math.PI), n:n };
  }

  function doBase(p){
    if(!p){ say('ボールが見つかりません<br><span style="font-size:13px">明るいところで、もう一度タップしてみて</span>'); return; }
    baseBuf.push(p);
    if(baseBuf.length>=BASE_N){
      var sx=0,sy=0,sr=0;
      for(var i=0;i<baseBuf.length;i++){ sx+=baseBuf[i].x; sy+=baseBuf[i].y; sr+=baseBuf[i].r; }
      baseline={ x:sx/BASE_N, y:sy/BASE_N, r:sr/BASE_N };
      phase='ready'; say('打ってOK！ ⛳️');
    } else say('そのまま待ってて…');
  }

  function doReady(p, now){
    if(!p) return;
    var dx=p.x-baseline.x, dy=p.y-baseline.y;
    if(Math.sqrt(dx*dx+dy*dy) > baseline.r*MOVE_TRIG){
      phase='burst'; postCount=0; track=[{x:p.x,y:p.y,r:p.r,t:now}];
    }
  }

  function finish(){
    phase='done';
    var good=[];
    for(var i=0;i<track.length;i++){ if(track[i].r>=2.2) good.push(track[i]); }
    $('result').style.display='flex';
    if(good.length<2){
      $('rLead').textContent='うまく追えませんでした';
      $('rBig').innerHTML='—';
      $('rSub').innerHTML='ボールをもっと大きく写して、明るいところで<br>'+info();
    } else {
      var b=good[good.length-1];
      var sc=BALL_MM/(2*b.r);
      var lat=(b.x-baseline.x)*sc;          // mm（右が＋）
      var cm=Math.abs(lat)/10;
      var dir = Math.abs(cm)<0.8 ? 'まっすぐ！' : (lat>0?'右に':'左に');
      $('rLead').textContent = (Math.abs(cm)<0.8?'ナイスショット':'ブレたのは') ;
      $('rBig').innerHTML = (Math.abs(cm)<0.8 ? 'まっすぐ'
        : dir+'<br>'+cm.toFixed(1)+'<small>cm</small>');
      $('rSub').innerHTML = 'ボール'+(Math.abs(lat)/BALL_MM).toFixed(1)+'個分／'+good.length+'コマ追えました<br>'+info();
    }
    say('');
    $('btn').textContent='⛳️ もう一球'; $('btn').style.display='block';
  }
  function info(){
    var t=stream&&stream.getVideoTracks()[0], s=(t&&t.getSettings)?t.getSettings():{};
    return '実測'+fps.toFixed(0)+'fps（カメラ申告'+(s.frameRate?Math.round(s.frameRate):'?')+'fps）';
  }

  function draw(p){
    var r=cv.getBoundingClientRect(), kx=r.width/AW, ky=r.height/AH;
    cx.clearRect(0,0,r.width,r.height);
    if(phase==='done'){
      cx.strokeStyle='rgba(166,255,0,.9)'; cx.lineWidth=3; cx.beginPath();
      for(var i=0;i<track.length;i++){ var q=track[i];
        if(i===0) cx.moveTo(q.x*kx,q.y*ky); else cx.lineTo(q.x*kx,q.y*ky); }
      cx.stroke(); return;
    }
    if(phase==='pick'){
      var gx=r.width/2, gy=r.height*0.72, gr=Math.max(26, r.width*0.085);
      cx.strokeStyle='rgba(166,255,0,.85)'; cx.lineWidth=2.5; cx.setLineDash([7,6]);
      cx.beginPath(); cx.arc(gx,gy,gr,0,Math.PI*2); cx.stroke(); cx.setLineDash([]);
    }
    if(baseline){ cx.strokeStyle='rgba(255,255,255,.3)'; cx.lineWidth=1.5; cx.setLineDash([4,4]);
      cx.beginPath(); cx.arc(baseline.x*kx, baseline.y*ky, baseline.r*kx*1.4,0,Math.PI*2); cx.stroke(); cx.setLineDash([]); }
    if(p){ cx.strokeStyle='#a6ff00'; cx.lineWidth=3;
      cx.beginPath(); cx.arc(p.x*kx, p.y*ky, Math.max(7,p.r*kx*1.4),0,Math.PI*2); cx.stroke(); }
  }

  // タップでボール登録（しきい値は自動）
  cv.addEventListener('click', function(ev){
    if(!running || phase==='burst' || phase==='done') return;
    var r=cv.getBoundingClientRect();
    var x=Math.round((ev.clientX-r.left)/r.width*AW), y=Math.round((ev.clientY-r.top)/r.height*AH);
    var d=actx.getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data;
    var sr=0,sg=0,sb=0,n=0;
    for(var i=0;i<d.length;i+=4){ sr+=d[i]; sg+=d[i+1]; sb+=d[i+2]; n++; }
    ref={ r:sr/n, g:sg/n, b:sb/n };
    // 塊が広がりすぎない最大のしきい値を自動で選ぶ
    var img=actx.getImageData(0,0,AW,AH).data, best=40;
    for(var t=30;t<=130;t+=10){ thr=t; var q=detect(img, ref, {x:x,y:y,r:16}); if(!q) continue; if(q.n>3500) break; best=t; }
    thr=best;
    last={x:x,y:y,r:14}; baseline=null; baseBuf=[]; lost=0; phase='base';
    say('そのまま待ってて…');
  });

  $('btn').addEventListener('click', function(){
    if(phase==='idle'){ start(); return; }
    $('result').style.display='none'; $('btn').style.display='none';
    baseline=null; baseBuf=[]; track=[]; postCount=0; lost=0; phase='base';
    say('そのまま待ってて…');
  });
  $('reset').addEventListener('click', function(){
    $('result').style.display='none'; $('btn').style.display='none';
    ref=null; baseline=null; baseBuf=[]; track=[]; lost=0; phase='pick';
    say('ガイドの中にボールが入るように置いて<br>ボールを<b>タップ</b> 👆');
  });
})();
</script>
</body>
</html>
