<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
  :root{ --neon:#a6ff00; --bg:#0a0d0a; --card:rgba(255,255,255,.05); --amber:#ffcf5a; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:max(12px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom));
    overflow:hidden; user-select:none; -webkit-user-select:none; }
  .wrap{ width:100%; max-width:460px; height:100%; display:flex; flex-direction:column; }
  header{ display:flex; justify-content:space-between; align-items:flex-start; }
  .title{ font-size:24px; font-weight:800; } .sub{ font-size:10px; font-weight:700; letter-spacing:3px; color:var(--neon); margin-top:2px; }
  .safe{ font-size:12px; font-weight:600; color:rgba(255,255,255,.85); background:rgba(255,255,255,.08); padding:6px 12px; border-radius:99px; }
  .ringwrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:150px; }
  .ring{ position:relative; width:200px; height:200px; }
  svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .track{ fill:none; stroke:rgba(255,255,255,.06); stroke-width:15; }
  .prog{ fill:none; stroke:var(--neon); stroke-width:15; stroke-linecap:round; transition:stroke-dashoffset .06s linear; }
  .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:28px; text-align:center; }
  .emoji{ font-size:40px; transition:transform .22s cubic-bezier(.2,1.5,.4,1); }
  .ctitle{ font-size:19px; font-weight:800; white-space:pre-line; } .csub{ font-size:11px; font-weight:700; color:rgba(255,255,255,.45); }
  .result{ background:var(--card); border-radius:16px; padding:13px; }
  .dist{ text-align:center; margin-bottom:9px; }
  .dist .v{ font-size:38px; font-weight:800; color:var(--neon); line-height:1; } .dist .u{ font-size:14px; font-weight:700; color:rgba(255,255,255,.6); margin-left:4px; } .dist .l{ font-size:10px; font-weight:600; color:rgba(255,255,255,.4); margin-top:3px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .cell{ background:rgba(255,255,255,.04); border-radius:11px; padding:8px 11px; }
  .cell .l{ font-size:10px; font-weight:600; color:rgba(255,255,255,.45); } .cell .v{ font-size:18px; font-weight:800; margin-top:1px; } .cell .v small{ font-size:11px; color:rgba(255,255,255,.55); }
  .verdict{ text-align:center; font-size:14px; font-weight:800; margin-top:8px; color:var(--neon); min-height:17px; }
  .diag{ text-align:center; font-size:10.5px; color:rgba(255,255,255,.4); margin-top:6px; font-variant-numeric:tabular-nums; min-height:13px; }
  .controls{ margin-top:11px; display:flex; flex-direction:column; gap:9px; align-items:center; }
  .primary{ width:100%; border:none; border-radius:99px; padding:15px; font-size:17px; font-weight:800; color:#000; background:var(--neon); } .primary.stop{ background:rgba(255,255,255,.85); }
  .row{ display:flex; gap:9px; width:100%; } .row button{ flex:1; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05); color:#fff; font-size:13px; font-weight:700; padding:11px; border-radius:99px; }
  .audition{ background:none; border:1px solid rgba(166,255,0,.45); color:var(--neon); font-size:12px; font-weight:700; padding:7px 14px; border-radius:99px; }
  .soundlabel{ font-size:12px; font-weight:800; min-height:14px; } .msg{ font-size:12px; color:var(--amber); text-align:center; min-height:15px; }
  .foot{ text-align:center; margin-top:6px; } .foot .n{ font-size:9px; color:rgba(255,255,255,.3); } .foot .p{ font-size:10px; font-weight:700; color:rgba(255,255,255,.45); margin-top:2px; }
  .hidden{ display:none !important; }
  /* インパクト演出 */
  .fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; }
  .flash{ position:fixed; inset:0; background:var(--neon); opacity:0; pointer-events:none; z-index:5; }
  .dist .v{ transition:transform .18s cubic-bezier(.2,1.6,.4,1); display:inline-block; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
  .shake{ animation:shake .32s ease; }
</style>
</head>
<body>
<div class="wrap">
  <header><div><div class="title">NICE SWING</div><div class="sub">SWING SOUND LAB</div></div><div class="safe">🛡 安全</div></header>
  <div class="ringwrap"><div class="ring">
    <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"></circle><circle class="prog" id="prog" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle></svg>
    <div class="center"><div class="emoji" id="emoji">🏌️</div><div class="ctitle" id="ctitle">安全を確認して
スタート</div><div class="csub" id="csub">MOTION READY</div></div>
  </div></div>
  <div class="result">
    <div class="dist"><span class="v" id="rDist">--</span><span class="u">yd</span><div class="l">推定飛距離（演出）</div></div>
    <div class="grid">
      <div class="cell"><div class="l">推定ヘッドスピード</div><div class="v" id="rHS">--<small> km/h</small></div></div>
      <div class="cell"><div class="l">手の速さ</div><div class="v" id="rTempo">--<small> m/s</small></div></div>
      <div class="cell"><div class="l">フェース</div><div class="v" id="rFace">--</div></div>
      <div class="cell"><div class="l">振りの大きさ</div><div class="v" id="rArc">--<small> %</small></div></div>
    </div>
    <div class="verdict" id="rVerdict"></div>
    <div class="diag" id="diag"></div>
  </div>
  <div class="controls">
    <button class="primary" id="btnMain">▶ 構える</button>
    <div class="row hidden" id="againRow"><button id="btnAgain">🔁 もう一球</button><button id="btnShare">📤 シェア</button></div>
    <a href="camera.html" class="audition" style="text-decoration:none;text-align:center">🎥 カメラ分析モード（β）</a>
    <button class="audition" id="btnAudition">🎵 打球音の候補を聴く（タップで次）</button>
    <div class="soundlabel" id="soundLabel"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="foot"><div class="n">飛距離は実測した速さ・振りの大きさからの推定演出。左右の曲がりは非対応（手持ちの限界）。</div><div class="p">Presented by 夜レジ</div></div>
</div>
<div id="flash" class="flash"></div>
<canvas id="fx" class="fx"></canvas>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id); const CIRC=2*Math.PI*52;

  // ===== 音 =====
  const AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const buffers={}; const SOUNDS={whoosh:'sounds/whoosh.wav',metal:'sounds/real_metal_shot.mp3',powerful:'sounds/real_powerful_shot.mp3',sharp:'sounds/real_sharp_hit.mp3',hard:'sounds/real_hard_hit.mp3',hitting:'sounds/real_hitting_ball.mp3'};
  (async function(){ await Promise.all(Object.entries(SOUNDS).map(async([k,u])=>{ try{ buffers[k]=await AC.decodeAudioData(await (await fetch(u)).arrayBuffer()); }catch(e){console.warn(k,e);} })); })();
  let windSrc=null,windGain=null;
  function startWind(){ if(!buffers.whoosh)return; stopWindNode(); windSrc=AC.createBufferSource(); windSrc.buffer=buffers.whoosh; windSrc.loop=true; windGain=AC.createGain(); windGain.gain.value=0; windSrc.connect(windGain).connect(AC.destination); windSrc.start(); }
  function stopWindNode(){ try{ if(windSrc)windSrc.stop(); }catch(e){} windSrc=null; windGain=null; }
  function setWind(n){ if(!windGain)return; windGain.gain.value=Math.min(1,Math.max(0,n))*0.9; if(windSrc)windSrc.playbackRate.value=0.8+n*1.1; }
  function playSound(name,vol,rate){ const b=buffers[name]; if(!b)return; const s=AC.createBufferSource(); s.buffer=b; s.playbackRate.value=rate||1; const g=AC.createGain(); g.gain.value=vol==null?1:vol; s.connect(g).connect(AC.destination); s.start(); }
  async function resumeAudio(){ try{ if(AC.state==='suspended') await AC.resume(); }catch(e){} }
  function beep(freq,dur,vol){ try{ const o=AC.createOscillator(),g=AC.createGain(); o.type='sine'; o.frequency.value=freq; o.connect(g).connect(AC.destination); const t=AC.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.start(t); o.stop(t+dur); }catch(e){} }
  function chime(){ beep(880,0.13,0.28); setTimeout(()=>beep(1320,0.2,0.28),120); }

  const P={ still:0.6, windStart:3.0, maxOmega:26.0, impactMin:12.0, minBuildMs:120,
    faceMaxDeg:35, fullTilt:170, minTilt:55, hsK:6.7, distK:11,
    damp:0.9, fullLin:6.0, minLin:3.0, leverK:6.5, distK2:31, countdownMs:2100 }; // 手速(m/s)主軸・実データ較正

  // ===== 状態 =====
  const ST={STANDBY:0,CALIB:1,READY:2,SWINGING:3,FINISH:4};
  let state=ST.STANDBY, armed=false, motionSeen=false, stillMs=0;
  let curGa=0, curG={x:0,y:0,z:-1}, haveOri=false, haveG=false;
  let curAl=0, curBe=0;                          // 向き（world変換用）
  let laX=0, laY=0, laZ=0, haveLA=false;         // 直線加速度（重力除去）＝手が空間を動いた量
  let biasX=0, biasY=0, biasZ=0;                 // アドレス静止時の残差（ドリフト対策）
  // アドレス基準（この基準を実際にフェース＆振り角に使う）
  let addrGa=0, addrG=null, haveRef=false;
  // 計測
  let buildMs=0, prevOmega=0, peakSeen=0, maxTilt=0, soundFired=false, finishAt=0, startT=0;
  let vx=0, vy=0, vz=0, peakLin=0, pathLen=0;   // world速度・手の最大速さ(m/s)・移動距離(m)
  const buf=[]; // {t,om,ga}
  function resetSwing(){ buildMs=0;prevOmega=0;peakSeen=0;maxTilt=0;soundFired=false;finishAt=0;startT=0;vx=0;vy=0;vz=0;peakLin=0;pathLen=0;buf.length=0;setWind(0);prog(0); }
  // 端末座標の加速度→world座標へ（DeviceOrientationのalpha/beta/gammaで回転）
  function toWorld(ax,ay,az){
    const z=curAl*Math.PI/180, x=curBe*Math.PI/180, y=curGa*Math.PI/180;
    const cX=Math.cos(x),sX=Math.sin(x),cY=Math.cos(y),sY=Math.sin(y),cZ=Math.cos(z),sZ=Math.sin(z);
    const m11=cZ*cY-sZ*sX*sY, m12=-cX*sZ, m13=cZ*sY+cY*sZ*sX;
    const m21=cY*sZ+cZ*sX*sY, m22=cZ*cX, m23=sZ*sY-cZ*cY*sX;
    const m31=-cX*sY,          m32=sX,    m33=cX*cY;
    return { x:m11*ax+m12*ay+m13*az, y:m21*ax+m22*ay+m23*az, z:m31*ax+m32*ay+m33*az };
  }
  function angd(a,b){ let d=a-b; while(d>180)d-=360; while(d<-180)d+=360; return d; }
  function tiltFrom(ref){ // 現在の重力方向と基準の角度差(度)＝空間でどれだけ傾いたか
    if(!ref||!haveG) return 0;
    const a=curG, b=ref; const ma=Math.hypot(a.x,a.y,a.z)||1, mb=Math.hypot(b.x,b.y,b.z)||1;
    let d=(a.x*b.x+a.y*b.y+a.z*b.z)/(ma*mb); d=Math.min(1,Math.max(-1,d));
    return Math.acos(d)*180/Math.PI;
  }

  function ingest(omega,dt){
    if(!armed) return; const now=performance.now();
    if(state===ST.CALIB){ prevOmega=omega; return; }
    if(state===ST.FINISH){ if(omega<P.still){ stillMs+=dt*1000; if(stillMs>400){ state=ST.READY; stillMs=0; resetSwing(); setCenter('振りかぶって\n振り下ろす','READY'); $('msg').textContent=''; } } else stillMs=0; prevOmega=omega; return; }
    if(state!==ST.READY && state!==ST.SWINGING){ prevOmega=omega; return; }
    if(omega<P.still && state===ST.READY){ stillMs+=dt*1000; prevOmega=omega; return; }
    stillMs=0;
    if(state===ST.READY){ state=ST.SWINGING; resetSwing(); startT=now; }

    buildMs+=dt*1000;
    buf.push({t:now,om:omega,ga:curGa}); if(buf.length>300)buf.shift();
    if(omega>peakSeen)peakSeen=omega;
    const t=tiltFrom(addrG); if(t>maxTilt)maxTilt=t;
    // ★手が空間をどれだけ動いたか＝直線加速度をworldへ回して積分（アドレスv=0からスタート）
    if(haveLA){ const aw=toWorld(laX-biasX, laY-biasY, laZ-biasZ);
      // 減衰付き積分（leaky）＝ドリフトの暴走を抑える。速さのピークを主指標にする
      vx=(vx+aw.x*dt)*P.damp; vy=(vy+aw.y*dt)*P.damp; vz=(vz+aw.z*dt)*P.damp;
      const sp=Math.hypot(vx,vy,vz); if(sp>peakLin && sp<20)peakLin=sp; pathLen+=sp*dt; }
    if(omega>P.windStart) emitWind(omega);

    // インパクト＝速さのピーク（impactMin以上で下降に転じた瞬間）。ここで鳴らす。
    if(!soundFired && buildMs>=P.minBuildMs && prevOmega>=P.impactMin && omega<prevOmega){
      soundFired=true; finishAt=now; playImpactSound(prevOmega);
    }
    if(soundFired && (now-finishAt>60)) finalizeSwing();
    prevOmega=omega;
  }
  function emitWind(omega){ const n=Math.min(1,Math.max(0,(omega-P.windStart)/(P.maxOmega-P.windStart))); setWind(n); prog(n); }
  // 振りの大きさ＝アドレスからの傾き（空間でどれだけ回ったか）。実データで full=170°基準。
  function sizeFactor(){ return Math.min(1, Math.max(0.05, maxTilt/P.fullTilt)); }
  function playImpactSound(peak){
    const weak = haveLA ? (peakLin < P.minLin) : (maxTilt < P.minTilt);
    if(weak){ playSound('hitting', 0.5, 0.9); if(navigator.vibrate)navigator.vibrate(15); impactFx(false); return; } // 手が動いてない＝鈍い弱音
    const hs = peakLin*P.leverK*3.6;
    playSound(hs>120?'metal':(hs>70?'powerful':'hitting'), Math.min(1,Math.max(0.45,peakLin/8)), 1.0);
    if(navigator.vibrate)navigator.vibrate(28);
    impactFx(true);
  }

  let lastResult=null;
  function finalizeSwing(){ state=ST.FINISH; stillMs=0; setWind(0); prog(0); lastResult=analyze(); showResult(lastResult); $('againRow').classList.remove('hidden'); $('msg').textContent='👍 アドレスに戻すと自動で次へ / もう一球でもOK'; }
  function analyze(){
    let iImp=0,mx=-1; for(let i=0;i<buf.length;i++){ if(buf[i].om>mx){mx=buf[i].om;iImp=i;} }
    const imp=buf[iImp]||{t:0,ga:0};
    const durMs=buf.length? Math.round((imp.t||0)-(buf[0].t||0)) : 0;
    // ★手が空間をどれだけ動いたか（＝スナップ判別の核。手首だけなら手は動かない）
    const moved = pathLen;            // m（積分した移動距離）
    const linMs = peakLin;            // m/s（手の最大速さ）
    const havePath = haveLA && linMs>0;
    // ★主軸＝手の"速さ"のピーク（距離=pathLenはドリフトで暴れるので判定に使わない）
    const sf = havePath ? Math.min(1, linMs/P.fullLin) : sizeFactor();
    const arcPct = Math.round(sf*100);
    const small = havePath ? (linMs < P.minLin) : (maxTilt < P.minTilt); // 手が速く動いてない＝手打ち
    const hsKmh = Math.round( havePath ? Math.min(230, linMs*P.leverK*3.6) : mx*P.hsK );
    let faceDeg=null,faceTxt='—'; if(haveRef){ const dG=angd(imp.ga,addrGa);
      if(Math.abs(dG)<=45){ faceDeg=dG; faceTxt=Math.abs(dG)<6?'スクエア':(dG>0?('開き'+Math.round(Math.abs(dG))+'°'):('被り'+Math.round(Math.abs(dG))+'°')); }
      else { faceTxt='—'; } } // 45°超は計測の暴れ＝非表示
    const sqScore=faceDeg!=null?Math.max(0,1-Math.abs(faceDeg)/P.faceMaxDeg):0.5;
    const q=0.2*sqScore+0.8*sf;   // フェースは弱い指標なので重み小、振りの速さ/大きさ主体
    const smash=1.15+q*0.33; const meetPct=Math.round(smash/1.5*100);
    const distYd = small ? Math.round(linMs*4*sf) : Math.round( havePath ? linMs*P.distK2*sf : Math.max(0,(mx-3))*P.distK*sf );
    let label = small ? '手打ち（手が動いてない）' : (q>=0.7?'会心の一撃':(q>=0.45?'ナイスショット':(sqScore<0.4?'こすり球':'ミスヒット')));
    return {hsKmh,faceTxt,arcPct,meetPct,distYd,label,q,peak:mx.toFixed(1),tilt:Math.round(maxTilt),durMs,
            moved:moved.toFixed(2),linMs:linMs.toFixed(1),havePath};
  }

  function prog(n){ $('prog').style.strokeDashoffset=CIRC*(1-Math.max(0.02,n)); }
  function setCenter(t,s){ $('ctitle').textContent=t; $('csub').textContent=s; }
  function showResult(r){
    countUp($('rDist'), r.distYd); resultFx(r.distYd, r.label); $('rHS').innerHTML=r.hsKmh+'<small> km/h</small>';
    $('rTempo').innerHTML=r.linMs+'<small> m/s</small>';
    $('rFace').textContent=r.faceTxt; $('rArc').innerHTML=r.arcPct+'<small> %</small>';
    $('rVerdict').textContent=r.label+'（ミート率 '+r.meetPct+'%）';
    $('diag').textContent='調整用 → 手速 '+r.linMs+'m/s / 手の移動 '+r.moved+'m / ω'+r.peak+' / 傾き'+r.tilt+'°'+(r.havePath?'':' ※直線加速度なし');
    setCenter(r.label,'NICE SWING!'); const e=$('emoji'); e.style.transform='scale(1.18)'; setTimeout(()=>e.style.transform='scale(1)',220);
  }
  function clearResult(){ ['rDist','rFace'].forEach(id=>$(id).textContent='--'); $('rHS').innerHTML='--<small> km/h</small>'; $('rTempo').innerHTML='--<small> m/s</small>'; $('rArc').innerHTML='--<small> %</small>'; $('rVerdict').textContent=''; $('diag').textContent=''; }

  // ===== センサー =====
  function onMotion(ev){ motionSeen=true;
    const g=ev.accelerationIncludingGravity; if(g&&(g.x!=null)){ curG={x:g.x,y:g.y,z:g.z}; haveG=true; }
    const la=ev.acceleration; if(la&&(la.x!=null)){ laX=la.x; laY=la.y; laZ=la.z; haveLA=true; }
    const r=ev.rotationRate; if(!r)return; const k=Math.PI/180;
    const omega=Math.hypot((r.alpha||0)*k,(r.beta||0)*k,(r.gamma||0)*k);
    const dt=(ev.interval&&ev.interval>0)?ev.interval:0.016; ingest(omega,dt); }
  function onOrient(ev){ if(ev.alpha==null&&ev.gamma==null&&ev.beta==null)return; curAl=ev.alpha||0; curBe=ev.beta||0; curGa=ev.gamma||0; haveOri=true; }
  async function startSensors(){
    try{
      if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
        let res; try{ res=await DeviceMotionEvent.requestPermission(); }catch(e){ $('msg').textContent='許可ダイアログを出せませんでした。もう一度押して。'; return false; }
        if(res!=='granted'){ $('msg').textContent='モーション不許可。設定→Safari→「モーションと画面の向きのアクセス」をオン→再読み込み。'; return false; }
      }
      if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){ try{ await DeviceOrientationEvent.requestPermission(); }catch(e){} }
      motionSeen=false; window.addEventListener('devicemotion',onMotion,true); window.addEventListener('deviceorientation',onOrient,true);
      setTimeout(()=>{ if(armed&&!motionSeen)$('msg').textContent='センサー値が届きません。設定のモーション許可を確認して。'; },1300);
      return true;
    }catch(e){ $('msg').textContent='この端末はモーション非対応です。'; return false; }
  }
  function stopSensors(){ window.removeEventListener('devicemotion',onMotion,true); window.removeEventListener('deviceorientation',onOrient,true); }

  // アドレスで基準を確定（重力方向＋roll）＝フェースと振り角の両方に使う
  function startCountdown(){
    state=ST.CALIB; clearResult(); $('againRow').classList.add('hidden'); $('emoji').textContent='🧍';
    const t0=performance.now(); let lastN=99;
    $('msg').textContent='⚙️ セットアップ：この向きを基準にします';
    const iv=setInterval(()=>{
      const el=performance.now()-t0; prog(Math.min(1,el/P.countdownMs));
      const n=Math.max(1,Math.ceil((P.countdownMs-el)/(P.countdownMs/3)));
      setCenter('⚙️ 基準をセット中','アドレスで動かさないで … '+n);
      if(n!==lastN){ lastN=n; beep(660,0.09,0.22); }   // ピッ ピッ ピッ
      if(el>=P.countdownMs){ clearInterval(iv);
        if(haveG){ addrG={x:curG.x,y:curG.y,z:curG.z}; } addrGa=curGa; haveRef=(haveG||haveOri);
        if(haveLA){ biasX=laX; biasY=laY; biasZ=laZ; }   // 静止時の残差＝バイアス
        chime(); $('emoji').textContent='✅'; setCenter('基準セット完了！','この向きが「まっすぐ」'); $('msg').textContent='';
        setTimeout(()=>{ $('emoji').textContent='🏌️'; state=ST.READY; resetSwing(); setCenter('振りかぶって\n振り下ろす','振ってOK！'); }, 900);
      }
    },50);
  }

  $('btnMain').addEventListener('click', async ()=>{
    if(!armed){ const ok=await startSensors(); await resumeAudio(); armed=true; if(!ok)return;
      startWind(); clearResult(); $('againRow').classList.add('hidden');
      $('btnMain').textContent='■ やめる'; $('btnMain').classList.add('stop'); startCountdown();
    }else{ armed=false; state=ST.STANDBY; stopSensors(); stopWindNode();
      $('btnMain').textContent='▶ 構える'; $('btnMain').classList.remove('stop');
      setCenter('安全を確認して\nスタート','MOTION READY'); prog(0); clearResult(); $('againRow').classList.add('hidden'); $('msg').textContent=''; }
  });
  $('btnAgain').addEventListener('click', ()=>{ if(!armed)return; startWind(); startCountdown(); });
  $('btnShare').addEventListener('click', async ()=>{ if(!lastResult)return; const r=lastResult;
    const txt=`NICE SWING 🏌️\n推定飛距離 ${r.distYd}yd / ヘッドスピード ${r.hsKmh}km/h / 振り ${r.tilt}°\n${r.label}（ミート率${r.meetPct}%）\nhttps://bombpass.github.io/swing/ #NICESWING #夜レジ`;
    try{ if(navigator.share){ await navigator.share({text:txt}); } else { await navigator.clipboard.writeText(txt); $('msg').textContent='結果をコピーしました'; } }catch(e){} });

  const CANDS=[['① メタルショット（金属カキーン）','metal'],['② パワフルショット','powerful'],['③ シャープヒット','sharp'],['④ ハードヒット','hard'],['⑤ ヒッティング（軽め）','hitting']];
  let ci=-1;
  $('btnAudition').addEventListener('click', async ()=>{ await resumeAudio(); ci=(ci+1)%CANDS.length; playSound(CANDS[ci][1],1,1); $('soundLabel').textContent='🔊 再生中：'+CANDS[ci][0]; });

  // ===== インパクト演出（撮れる5秒） =====
  const cv=$('fx'), cx=cv.getContext('2d'); let FW=0,FH=0;
  function sizeFx(){ const d=Math.min(2,window.devicePixelRatio||1); FW=cv.clientWidth; FH=cv.clientHeight; cv.width=FW*d; cv.height=FH*d; cx.setTransform(d,0,0,d,0,0); }
  window.addEventListener('resize',sizeFx); sizeFx();
  let parts=[], scene=null, rafOn=false;
  const easeOut=t=>1-Math.pow(1-t,2);
  function loop(){
    cx.clearRect(0,0,FW,FH);
    if(scene){ scene.t+=1/(scene.dur*60); if(scene.t>=1){ scene=null; } else drawScene(scene); }
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.02; cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); }
    cx.globalAlpha=1;
    if(parts.length||scene){ requestAnimationFrame(loop); } else { rafOn=false; }
  }
  function startLoop(){ if(!rafOn){ rafOn=true; requestAnimationFrame(loop); } }
  function burst(x,y,color,n,spd){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,s=Math.random()*spd+1; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,r:Math.random()*2.5+1.5,life:1,c:color}); } startLoop(); }
  function screenFlash(a){ const f=$('flash'); f.style.transition='none'; f.style.opacity=a; requestAnimationFrame(()=>{ f.style.transition='opacity .45s ease-out'; f.style.opacity=0; }); }
  function impactFx(real){ screenFlash(real?0.5:0.2); burst(FW*0.5,FH*0.28, real?'#a6ff00':'#888', real?22:10, real?8:4); }

  // みんゴル風コース＋ボール飛球
  function drawScene(s){
    const hy=FH*0.30, gy=FH*0.54, groundY=gy-FH*0.03, teeX=FW*0.12;
    let sky=cx.createLinearGradient(0,0,0,hy); sky.addColorStop(0,'#8fd4ff'); sky.addColorStop(1,'#e6f6ff');
    cx.fillStyle=sky; cx.fillRect(0,0,FW,hy);
    let gr=cx.createLinearGradient(0,hy,0,gy); gr.addColorStop(0,'#63c24e'); gr.addColorStop(1,'#3f9a37');
    cx.fillStyle=gr; cx.fillRect(0,hy,FW,gy-hy);
    cx.fillStyle='rgba(255,255,255,.12)'; cx.beginPath(); cx.moveTo(FW*0.08,gy); cx.lineTo(FW*0.42,hy+3); cx.lineTo(FW*0.60,hy+3); cx.lineTo(FW*0.96,gy); cx.closePath(); cx.fill();
    // グリーン＋旗
    const gxx=FW*0.82, gyy=hy+(gy-hy)*0.30;
    cx.fillStyle='#2e8b57'; cx.beginPath(); cx.ellipse(gxx,gyy+5,FW*0.085,FH*0.018,0,0,7); cx.fill();
    cx.strokeStyle='#f0f0f0'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(gxx,gyy-FH*0.06); cx.lineTo(gxx,gyy); cx.stroke();
    cx.fillStyle='#ff4d4d'; cx.beginPath(); cx.moveTo(gxx,gyy-FH*0.06); cx.lineTo(gxx+15,gyy-FH*0.05); cx.lineTo(gxx,gyy-FH*0.037); cx.closePath(); cx.fill();
    // ボール
    const carry=Math.min(1,s.t/0.72);
    const land=teeX+(s.landX-teeX)*easeOut(carry);
    const x=land+(s.slice?s.slice*carry*carry:0);
    const y=groundY - s.apex*Math.sin(carry*Math.PI);
    cx.fillStyle='rgba(0,0,0,.18)'; cx.beginPath(); cx.ellipse(x,groundY,7,2.5,0,0,7); cx.fill();
    if(carry<1){ s.trail.push({x,y}); if(s.trail.length>16)s.trail.shift(); }
    for(let i=0;i<s.trail.length;i++){ const t2=s.trail[i]; cx.globalAlpha=(i/s.trail.length)*0.4; cx.fillStyle='#fff'; cx.beginPath(); cx.arc(t2.x,t2.y,3,0,7); cx.fill(); }
    cx.globalAlpha=1;
    cx.fillStyle='#fff'; cx.beginPath(); cx.arc(x,y,6,0,7); cx.fill(); cx.strokeStyle='rgba(0,0,0,.2)'; cx.lineWidth=1; cx.stroke();
    if(!s.landed && carry>=1){ s.landed=true; for(let i=0;i<8;i++){ const a=Math.random()*Math.PI; parts.push({x,y:groundY,vx:Math.cos(a)*2,vy:-Math.sin(a)*2,r:2,life:0.8,c:'#e8dcc0'}); } }
    cx.fillStyle='rgba(0,0,0,.8)'; cx.font='800 20px -apple-system,sans-serif'; cx.textAlign='center';
    cx.fillText(s.flavor, FW*0.5, FH*0.115);
  }
  function resultFx(dist,label){
    const dF=Math.min(1, dist/280);
    let apex=FH*0.18, landFrac=0.4, slice=0, flavor='ナイスショット！';
    if(label==='会心の一撃'){ apex=FH*0.26; landFrac=0.55+dF*0.30; flavor='会心の一撃！'; }
    else if(label==='ナイスショット'){ apex=FH*0.20; landFrac=0.45+dF*0.30; flavor='ナイスショット！'; }
    else if(label==='こすり球'){ apex=FH*0.12; landFrac=0.40; slice=FW*0.20; flavor='スライス…'; }
    else if(label==='ミスヒット'){ apex=FH*0.10; landFrac=0.34; flavor='ミスヒット'; }
    else { apex=FH*0.02; landFrac=0.20; flavor='ボテボテ…'; }   // 手打ち
    const landX=FW*(0.12+(0.80-0.12)*landFrac);
    scene={ t:0, dur:2.0, landX, apex, slice, flavor, trail:[], landed:false };
    startLoop();
    if(label==='会心の一撃'){ burst(FW*0.5,FH*0.28,'#ffd54a',30,9); const d=document.querySelector('.dist'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  }
  function countUp(el,to){ let cur=0; const step=Math.max(1,Math.ceil(to/22)); el.style.transform='scale(1.35)'; const iv=setInterval(()=>{ cur+=step; if(cur>=to){cur=to;clearInterval(iv);} el.textContent=cur; },22); setTimeout(()=>el.style.transform='scale(1)',210); }
})();
</script>
</body>
